# Offline test suites only: no secrets, no model/provider calls.
# tests/e2e/real-* are excluded by vitest.config.ts unless AGENTHUB_REAL_TESTS=1,
# which this workflow never sets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Build first: tests/unit/print-workflow-cli.test.ts executes dist/index.js.
      - name: Type-check and build (tsc)
        run: npm run build

      - name: Unit / integration / offline e2e tests (vitest)
        # Large artifact fixtures need headroom on the smaller macOS runners.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm test -- --maxWorkers=2 --minWorkers=1

      - name: Script tests (node:test)
        run: node --test tests/local/*.test.mjs

      - name: Guardrails tests (Python unittest + node:test)
        run: ./guardrails/run-tests.sh
